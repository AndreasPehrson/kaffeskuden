<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f1114" />

    <title>Kaffeskuden — Rullende kaffebar til events</title>
    <meta
      name="description"
      content="Kaffeskuden er en rullende kaffebar med kaffecykel, kaffebil og pop-up barista til firmaevents, markeder, bryllupper og private fester i Danmark."
    />
    <link rel="canonical" href="https://kaffeskuden.dk/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:site_name" content="Kaffeskuden" />
    <meta property="og:url" content="https://kaffeskuden.dk/" />
    <meta property="og:title" content="Kaffeskuden — Rullende kaffebar til events" />
    <meta
      property="og:description"
      content="Rullende kaffebar med specialkaffe på hjul. Book Kaffeskuden til dit næste event, marked eller fest."
    />
    <meta property="og:image" content="https://kaffeskuden.dk/hero.jpg" />
    <meta property="og:image:alt" content="Kaffeskuden serverer kaffe ved et event" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kaffeskuden — Rullende kaffebar til events" />
    <meta
      name="twitter:description"
      content="Rullende kaffebar med specialkaffe på hjul. Book Kaffeskuden til dit næste event."
    />
    <meta name="twitter:image" content="https://kaffeskuden.dk/hero.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://kaffeskuden.dk/#organization",
        "name": "Kaffeskuden",
        "url": "https://kaffeskuden.dk/",
        "image": "https://kaffeskuden.dk/hero.jpg",
        "logo": "https://kaffeskuden.dk/logo.jpg",
        "description": "Rullende kaffebar med specialkaffe på hjul til firmaevents, markeder, bryllupper og private fester.",
        "email": "hej@kaffeskuden.dk",
        "telephone": "+4561786779",
        "areaServed": {
          "@type": "Country",
          "name": "Danmark"
        },
        "sameAs": ["https://www.instagram.com/kaffeskuden/"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Eventtyper",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Firmaevents",
                "description": "Pop-up kaffebar til konferencer, kontordage og messer."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Private fester",
                "description": "Baristaoplevelse til bryllup, reception og store fejringer."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Byliv og markeder",
                "description": "Rullende kaffe til offentlige events og markeder."
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
